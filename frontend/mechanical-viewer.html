        }

        .video-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .video-number {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            width: fit-content;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .video-source {
            font-size: 0.85rem;
            color: var(--accent-purple);
            margin-bottom: 0.75rem;
        }

        .video-duration {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            color: var(--light-purple);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .video-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .video-learning-points {
            margin-top: auto;
        }

        .video-learning-points h5 {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .video-learning-points ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .video-learning-points li {
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 0.3rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .video-learning-points li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--success-green);
            font-weight: bold;
        }

        .video-summary {
            margin-top: 1.5rem;
            padding: 1rem 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success-green);
            border-radius: 0 8px 8px 0;
        }

        .video-summary h4 {
            color: var(--success-green);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .video-summary p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Inline Video Embeds (auto-detected from YouTube URLs in content) */
        .inline-video-embed {
            margin: 1.5rem 0;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .inline-video-embed:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 6px 24px rgba(52, 211, 153, 0.15);
        }

        .inline-video-embed.compact {
            max-width: 640px;
        }

        .inline-video-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 1.2rem;
            background: linear-gradient(135deg, rgba(15, 123, 116, 0.3), rgba(18, 94, 91, 0.3));
            border-bottom: 1px solid var(--card-border);
        }

        .inline-video-icon {
            font-size: 1.2rem;
        }

        .inline-video-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .inline-video-duration {
            margin-left: auto;
            background: rgba(52, 211, 153, 0.2);
            color: var(--accent-purple);
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .inline-video-player {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }

        .inline-video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Legacy video grid for backward compatibility */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
        }

        @media (max-width: 900px) {
            .video-item {
                flex-direction: column;
            }
            
            .video-embed-container {
                flex: none;
                width: 100%;
            }
        }

        /* Activity Styles */
        .activity-item {
            background: rgba(168, 85, 247, 0.1);
            border-left: 4px solid var(--accent-purple);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .activity-item h4 {
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .activity-item p {
            color: var(--text-secondary);
        }

        .activity-type {
            display: inline-block;
            background: var(--primary-purple);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        /* Discussion Styles */
        .discussion-topic {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--info-blue);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .discussion-topic h4 {
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .discussion-topic p {
            color: var(--text-secondary);
        }

        /* Resource Styles */
        .resource-item {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success-green);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .resource-item h4 {
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .resource-item a {
            color: var(--success-green);
            text-decoration: none;
            font-weight: 600;
        }

        .resource-item a:hover {
            text-decoration: underline;
        }

        /* Checklist Styles (for - [ ] items) */
        .checklist {
            list-style: none;
            margin: 1rem 0;
            padding: 0;
            background: rgba(16, 185, 129, 0.05);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            padding: 0.5rem 0;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .check-icon {
            font-size: 1rem;
            color: var(--text-muted);
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .checklist-item.checked .check-icon {
            color: var(--success-green);
        }

        .check-text {
            flex: 1;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .checklist-item.checked .check-text {
            color: var(--success-green);
        }

        /* Key Takeaways Styles */
        .takeaway-list {
            list-style: none;
            margin-left: 0;
        }

        .takeaway-list li {
            background: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warning-yellow);
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
        }

        .takeaway-list li::before {
            content: '💡';
            margin-right: 0.5rem;
        }

        /* Shake animation for unanswered questions */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Response/Discussion Text Area */
        .response-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid var(--card-border);
        }

        .response-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.875rem;
        }

        .response-label::before {
            content: '✍️';
        }

        .response-textarea {
            width: 100%;
            min-height: 140px;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1.05rem;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .response-textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .response-textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .response-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.875rem;
            margin-top: 0.875rem;
        }

        .response-save-btn {
            padding: 0.625rem 1.25rem;
            background: linear-gradient(145deg, var(--primary-purple), var(--secondary-purple));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .response-save-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .response-save-btn.saved {
            background: var(--success-green);
        }

        .response-char-count {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.5rem;
        }

        /* Interactive Quiz Styles - Accessible Design */
        .quiz-container {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.75rem;
            margin: 2rem 0;
            border: 1px solid var(--card-border);
        }

        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .quiz-header-title {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quiz-header-title span {
            font-size: 1.35rem;
        }

        .quiz-progress {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .quiz-question {
            background: rgba(139, 92, 246, 0.06);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(139, 92, 246, 0.2);
            transition: all 0.2s ease;
        }

        .quiz-question:hover {
            border-color: rgba(139, 92, 246, 0.35);
        }

        .quiz-question.answered {
            border-color: var(--accent-purple);
        }

        .quiz-question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .quiz-question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, var(--primary-purple), var(--secondary-purple));
            color: white;
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
            margin-left: 0;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(139, 92, 246, 0.25);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .quiz-option:hover {
            background: rgba(139, 92, 246, 0.12);
            border-color: var(--accent-purple);
        }

        .quiz-option .radio-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-purple);
            border-radius: 50%;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .quiz-option .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-purple);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .quiz-option.selected {
            background: rgba(139, 92, 246, 0.18);
            border-color: var(--accent-purple);
        }

        .quiz-option.selected .radio-custom::after {
            opacity: 1;
        }

        .quiz-option.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: var(--success-green);
        }

        .quiz-option.correct .radio-custom {
            border-color: var(--success-green);
        }

        /* Only show filled radio for selected correct answer */
        .quiz-option.selected.correct .radio-custom {
            background: var(--success-green);
        }

        .quiz-option.selected.correct .radio-custom::after {
            background: white;
            opacity: 1;
        }

        .quiz-option.incorrect {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .quiz-option.incorrect .radio-custom {
            border-color: #ef4444;
        }

        .quiz-option-text {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .quiz-option-text strong {
            color: var(--light-purple);
            margin-right: 0.35rem;
        }

        .quiz-feedback {
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.85rem;
        }

        .quiz-feedback.correct {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border-left: 3px solid var(--success-green);
            color: var(--success-green);
        }

        .quiz-feedback.incorrect {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border-left: 3px solid #ef4444;
            color: #ef4444;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .quiz-check-btn {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .quiz-check-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        .quiz-reset-btn {
            padding: 0.6rem 1rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .quiz-reset-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .quiz-score {
            display: none;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(147, 51, 234, 0.15));
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-top: 1rem;
            border: 1px solid var(--accent-purple);
            text-align: center;
        }

        .quiz-score.show {
            display: block;
        }

        .quiz-score-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .quiz-score-circle {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .quiz-score-circle svg {
            transform: rotate(-90deg);
        }

        .quiz-score-circle .bg {
            fill: none;
            stroke: rgba(168, 85, 247, 0.2);
            stroke-width: 8;
        }

        .quiz-score-circle .progress {
            fill: none;
            stroke: var(--accent-purple);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .quiz-score-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .quiz-score-details {
            text-align: left;
        }

        .quiz-score-label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .quiz-score-message {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .quiz-score-message.excellent { color: var(--success-green); }
        .quiz-score-message.good { color: var(--info-blue); }
        .quiz-score-message.needs-work { color: var(--warning-yellow); }

        /* Matching Quiz Styles */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }

        .matching-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 2px solid var(--card-border);
        }

        .matching-select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .matching-select option {
            background: #1e1b4b;
            color: var(--text-primary);
        }

        /* Navigation Styles */
        .navigation-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--card-border);
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Inner Section Navigation (within a session) */
        .inner-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--card-border);
        }

        .inner-nav-btn {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .inner-nav-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }

        .inner-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .section-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .section-dot:hover {
            background: rgba(168, 85, 247, 0.6);
        }

        .section-dot.active {
            background: var(--accent-purple);
            width: 12px;
            height: 12px;
            box-shadow: 0 0 8px var(--accent-purple);
        }

        .section-counter {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Single Section Display */
        .section-slide {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section-slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-purple));
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(168, 85, 247, 0.4);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .complete-button {
            background: linear-gradient(135deg, var(--success-green), #059669);
        }

        .complete-button.completed {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }

        .complete-button:hover:not(:disabled) {
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.4);
        }

        /* Loading and Error States */
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
            color: #fca5a5;
        }

        .error h3 {
            color: #ef4444;
            margin-bottom: 0.5rem;
        }

        /* Scrollbar Styles */
        .sidebar::-webkit-scrollbar,
        .main-content::-webkit-scrollbar {
            width: 8px;

        // Global state
        let curriculumData = null;
        let sessionsList = [];

        // Initialize the application
        async function init() {
            loadProgress();
            await loadCurriculum();
            buildSessionList();
            renderSidebar();
            showOverview();
        }

        // Load curriculum from markdown file
        async function loadCurriculum() {
            try {
                const response = await fetch('../curriculum/MECHANICAL_ENGINEERING_CURRICULUM.md');
                if (!response.ok) {
                    throw new Error(`Failed to load curriculum: ${response.status}`);
                }
                const markdown = await response.text();
                curriculumData = parseMarkdown(markdown);
            } catch (error) {
                console.error('Error loading curriculum:', error);
                document.getElementById('contentWrapper').innerHTML = `
                    <div class="error" role="alert">
                        <h3>Error Loading Curriculum</h3>
                        <p>${error.message}</p>
                        <p>Please ensure the curriculum file exists at ../curriculum/MECHANICAL_ENGINEERING_CURRICULUM.md (relative to this HTML file)</p>
                    </div>
                `;
            }
        }

        // Parse markdown into structured data
        function parseMarkdown(markdown) {
            const lines = markdown.split('\n');
            const curriculum = {
                title: '',
                description: '',
                days: []
            };
            
            let currentDay = null;
            let currentSession = null;
            let currentSection = null;
            let contentBuffer = [];

            function saveContentBuffer() {
                if (contentBuffer.length > 0 && currentSection) {
                    currentSection.content = contentBuffer.join('\n').trim();
                    contentBuffer = [];
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Main title (# Mechanical Engineering Curriculum)
                if (line.startsWith('# ') && !line.match(/# (?:DAY|WEEK) \d+/i)) {
                    curriculum.title = line.substring(2).trim();
                    continue;
                }

                // Day/Week headers (# DAY X: Title or # WEEK X: Title)
                const dayMatch = line.match(/^# (?:DAY|WEEK) (\d+):\s*(.+)/i);
                if (dayMatch) {
                    saveContentBuffer();
                    if (currentSession && currentDay) {
                        currentDay.sessions.push(currentSession);
                    }
                    if (currentDay) {
                        curriculum.days.push(currentDay);
                    }
                    currentDay = {
                        number: parseInt(dayMatch[1]),
                        title: dayMatch[2].trim(),
                        sessions: []
                    };
                    currentSession = null;
                    currentSection = null;
                    continue;
                }

                // Session headers (## Session X.Y: Title)
                const sessionMatch = line.match(/^## Session ([\d.]+):\s*(.+)/i);
                if (sessionMatch) {
                    saveContentBuffer();
                    if (currentSession && currentDay) {
                        currentDay.sessions.push(currentSession);
                    }
                    currentSession = {
                        number: sessionMatch[1],
                        title: sessionMatch[2].trim(),
                        sections: {}
                    };
                    currentSection = null;
                    continue;
                }

                // Section headers (### Learning Objectives, etc.)
                if (line.startsWith('### ')) {
                    saveContentBuffer();
                    const sectionTitle = line.substring(4).trim();
                    const sectionKey = sectionTitle.toLowerCase().replace(/[^a-z0-9]+/g, '_');
                    currentSection = {
                        title: sectionTitle,
                        content: ''
                    };
                    if (currentSession) {
                        currentSession.sections[sectionKey] = currentSection;
                    }
                    continue;
                }

                // Collect content
                if (currentSection) {
                    contentBuffer.push(line);
                } else if (currentSession && !currentSection && line.trim()) {
                    // Content before any section (description)
                    if (!currentSession.description) {
                        currentSession.description = line.trim();
                    } else {
                        currentSession.description += '\n' + line;
                    }
                } else if (!currentDay && !currentSession && line.trim()) {
                    // Course description
                    curriculum.description += line + '\n';
                }
            }

            // Save final buffers
            saveContentBuffer();
            if (currentSession && currentDay) {
                currentDay.sessions.push(currentSession);
            }
            if (currentDay) {
                curriculum.days.push(currentDay);
            }

            return curriculum;
        }

                        dayTitle: day.title,
                        sessionNumber: session.number,
                        sessionTitle: session.title,
                        session: session
                    });
                });
            });

            // Get icon for section based on key name or section title

                if (searchText.includes('welcome') || searchText.includes('journey')) return '👋';
                if (searchText.includes('learning') || searchText.includes('objective')) return '🎯';
                if (searchText.includes('understanding') || searchText.includes('deep_dive') || searchText.includes('content') || searchText.includes('delivery')) return '📖';
                if (searchText.includes('video')) return '🎬';
                if (searchText.includes('activit') || searchText.includes('hands') || searchText.includes('interactive') || searchText.includes('scavenger') || searchText.includes('timeline') || searchText.includes('detective')) return '🔬';
                if (searchText.includes('quiz') || searchText.includes('knowledge') || searchText.includes('check')) return '✏️';
                if (searchText.includes('discussion') || searchText.includes('debate') || searchText.includes('talk')) return '💬';
                if (searchText.includes('resource') || searchText.includes('reading')) return '📚';
                if (searchText.includes('takeaway') || searchText.includes('summary') || searchText.includes('reflection')) return '⭐';
                if (searchText.includes('assignment') || searchText.includes('homework')) return '📋';
                // For numbered sections, use different icons
                if (key.match(/section_1/)) return '👋';
                if (key.match(/section_2/)) return '🧠';
                if (key.match(/section_3/)) return '🎬';
                if (key.match(/section_4/)) return '🔬';
                if (key.match(/section_5/)) return '💬';
                if (key.match(/section_6/)) return '✅';
                return '📌';
            }

            // Collect all sections
            const sections = [];
            Object.entries(session.sections).forEach(([key, section]) => {
                if (!section || !section.content) return;
                const icon = getSectionIcon(key, section.title || '');
                const title = section.title || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                sections.push({ key, icon, title, content: section.content });

            });

            totalInnerSections = sections.length;
            currentInnerSection = 0; // Reset to first section

            let html = `
                <div class="session-header">
                    <h1>Session ${sessionNumber}: ${sessionTitle}</h1>
                    <div class="session-meta">Week ${dayNumber}: ${dayTitle}</div>
                </div>
            `;

            // Inner navigation bar
            html += `
                <div class="inner-navigation">
                    <button class="inner-nav-btn" onclick="navigateInnerSection(-1)" id="innerPrevBtn" disabled>
                        ◀ Prev Section
                    </button>
                    <div class="section-indicator">
                        ${sections.map((s, i) => `
                            <div class="section-dot ${i === 0 ? 'active' : ''}" 
                                 onclick="jumpToInnerSection(${i})" 
                                 title="${s.title}"></div>
                        `).join('')}
                    </div>
                    <span class="section-counter" id="sectionCounter">1 / ${sections.length}</span>
                    <button class="inner-nav-btn" onclick="navigateInnerSection(1)" id="innerNextBtn" ${sections.length <= 1 ? 'disabled' : ''}>
                        Next Section ▶
                    </button>
                </div>
            `;

            // Render each section as a slide
            html += '<div id="sectionsContainer">';
            sections.forEach((section, index) => {
                html += `
                    <div class="section-slide ${index === 0 ? 'active' : ''}" data-section-index="${index}">
                        ${renderSectionHTML(section.icon, section.title, section.content)}
                    </div>
                `;
            });
            html += '</div>';

            // Session navigation (between sessions) - Hidden until last section
            const isLastSection = sections.length <= 1;
            html += `
                <div class="navigation-controls" id="sessionNavigation" style="${isLastSection ? '' : 'display: none;'}">
                    <button class="nav-button" onclick="moveToNextSession(-1)" ${currentSessionIndex === 0 ? 'disabled' : ''}>
                        ◀ Previous Session
                    </button>
                    <button class="nav-button complete-button ${isCompleted ? 'completed' : ''}" onclick="toggleComplete()">
                        ${isCompleted ? '✓ Completed' : 'Mark Complete'}
                    </button>
                    <button class="nav-button" onclick="moveToNextSession(1)" ${currentSessionIndex === sessionsList.length - 1 ? 'disabled' : ''}>
                        Next Session ▶
                    </button>
                </div>
            `;

            return html;
        }

        // Navigate between inner sections
        function navigateInnerSection(direction) {
            const newIndex = currentInnerSection + direction;
            if (newIndex >= 0 && newIndex < totalInnerSections) {
                jumpToInnerSection(newIndex);
            }
        }

        // Jump to a specific inner section
        function jumpToInnerSection(index) {
            currentInnerSection = index;
            
            // Update slides visibility
            document.querySelectorAll('.section-slide').forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            
            // Update dots
            document.querySelectorAll('.section-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            
            // Update counter
            document.getElementById('sectionCounter').textContent = `${index + 1} / ${totalInnerSections}`;
            
            // Update buttons
            document.getElementById('innerPrevBtn').disabled = (index === 0);
            document.getElementById('innerNextBtn').disabled = (index === totalInnerSections - 1);
            
            // Show/hide session navigation based on whether we're at the last section
            const sessionNav = document.getElementById('sessionNavigation');
            if (sessionNav) {
                if (index === totalInnerSections - 1) {
                    sessionNav.style.display = 'flex';
                } else {
                    sessionNav.style.display = 'none';
                }
            }
            
            // Scroll to top of content
            document.getElementById('contentWrapper').scrollTop = 0;
        }

        // Parse session content for special elements
        function parseSessionContent(content) {
            const result = {
                videos: '',
                activities: '',
                discussions: '',
                resources: '',
                takeaways: ''
            };

            // Parse videos (YouTube links) with enhanced information
            const videoBlockRegex = /\*\*Video\s+(\d+):\s*(.+?)\*\*\n\n(?:\*(.+?)\*\s*(?:\((\d+)\s*minutes?\))?)?\n\n([\s\S]*?)(?=https?:\/\/)/g;
            const videoBlocks = [...content.matchAll(videoBlockRegex)];
            
            // Also get the YouTube URLs
            const videoRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
            const videoMatches = [...content.matchAll(videoRegex)];
            
            if (videoMatches.length > 0) {
                result.videos = '<div class="video-section">';
                
                // Add section intro
                result.videos += `
                    <div class="video-section-intro">
                        <h4>Video Learning Resources</h4>
                        <p>Watch these carefully selected videos to deepen your understanding. Take notes and use the learning checkpoints to verify your comprehension.</p>
                    </div>
                `;
                
                videoMatches.forEach((match, index) => {
                    const videoId = match[1];
                    
                    // Extract video metadata from nearby content
                    let videoTitle = `Video ${index + 1}`;
                    let videoSource = '';
                    let videoDuration = '';
                    let videoDescription = '';
                    let learningPoints = [];
                    
                    // Parse content to find video info
                    const lines = content.split('\n');
                    let foundVideoBlock = false;
                    let inLearningPoints = false;
                    
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        
                        // Find video title (e.g., **Video 1: Neural Networks Explained**)
                        const titleMatch = line.match(/\*\*Video\s+\d+:\s*(.+?)\*\*/);
                        if (titleMatch && !foundVideoBlock) {
                            // Check if this is for our current video
                            let searchIndex = i;
                            while (searchIndex < lines.length && searchIndex < i + 15) {
                                if (lines[searchIndex].includes(match[0])) {
                                    videoTitle = titleMatch[1].trim();
                                    foundVideoBlock = true;
                                    break;
                                }
                                searchIndex++;
                            }
                        }
                        
                        // Find source and duration (e.g., *"Video title"* by Channel (19 minutes))
                        if (foundVideoBlock && !videoSource) {
                            const sourceMatch = line.match(/\*[""'](.+?)[""']\*\s*(?:by\s+)?(.+?)(?:\s*\((\d+)\s*minutes?\))?$/);
                            if (sourceMatch) {
                                videoSource = sourceMatch[2] ? sourceMatch[2].trim() : '';
                                videoDuration = sourceMatch[3] ? `${sourceMatch[3]} min` : '';
                            }
                        }
                        
                        // Find description (text after source, before learning points)
                        if (foundVideoBlock && videoSource && !inLearningPoints && !line.includes(match[0])) {
                            if (line.startsWith('This video') || line.startsWith('Pay attention') || 
                                line.startsWith('Watch for') || line.startsWith('Learn about')) {
                                videoDescription += line + ' ';
                            }
                        }
                        
                        // Find learning points (after "After watching" or "- [ ]")
                        if (line.includes('After watching') || line.includes('confirm you understand')) {
                            inLearningPoints = true;
                        }
                        
                        if (inLearningPoints && line.match(/^- \[[ x]\]\s*(.+)/)) {
                            const pointMatch = line.match(/^- \[[ x]\]\s*(.+)/);
                            if (pointMatch) {
                                learningPoints.push(pointMatch[1].trim());
                            }
                        }
                        
                        // Stop at next video or section
                        if (foundVideoBlock && (line.match(/\*\*Video\s+\d+:/) && !line.includes(videoTitle)) || line.startsWith('###')) {
                            break;
                        }
                    }
                    
                    result.videos += `
                        <div class="video-item">
                            <div class="video-embed-container">
                                <div class="video-embed">
                                    <iframe src="https://www.youtube.com/embed/${videoId}" 
                                            allowfullscreen 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                                    </iframe>
                                </div>
                            </div>
                            <div class="video-info">
                                <span class="video-number">Video ${index + 1}</span>
                                <div class="video-title">${videoTitle}</div>
                                ${videoSource ? `<div class="video-source">${videoSource}${videoDuration ? `<span class="video-duration">${videoDuration}</span>` : ''}</div>` : ''}
                                ${videoDescription ? `<div class="video-description">${videoDescription.trim()}</div>` : ''}
                                ${learningPoints.length > 0 ? `
                                    <div class="video-learning-points">
                                        <h5>What You Will Learn</h5>
                                        <ul>
                                            ${learningPoints.map(point => `<li>${point}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                
                // Add summary at the end
                result.videos += `
                    <div class="video-summary">
                        <h4>After Watching All Videos</h4>
                        <p>Take a moment to review your notes. Can you explain the key concepts in your own words? If any points are unclear, re-watch the relevant sections before proceeding to the knowledge check.</p>
                    </div>
                </div>`;
            }

            // Parse activities (numbered or bulleted items)
            const activityRegex = /(?:^|\n)(?:\d+\.|[-*])\s*\*\*(.+?)\*\*:?\s*(.+?)(?=\n(?:\d+\.|[-*]|\n)|$)/gs;
            const activityMatches = [...content.matchAll(activityRegex)];
            
            if (activityMatches.length > 0) {
                activityMatches.forEach(match => {
                    const title = match[1].trim();
                    const description = match[2].trim();
                    result.activities += `
                        <div class="activity-item">
                            <div class="activity-type">Activity</div>
                            <h4>${title}</h4>
                            <p>${markdownToHtml(description)}</p>
                        </div>
                    `;
                });
            } else {
                result.activities = markdownToHtml(content);
            }

            // Parse discussions
            const discussionMatches = [...content.matchAll(activityRegex)];
            if (discussionMatches.length > 0) {
                discussionMatches.forEach(match => {
                    const title = match[1].trim();
                    const description = match[2].trim();
                    result.discussions += `
                        <div class="discussion-topic">
                            <h4>${title}</h4>
                            <p>${markdownToHtml(description)}</p>
                        </div>
                    `;
                });
            } else {
                result.discussions = markdownToHtml(content);
            }

            // Parse resources
            const resourceMatches = [...content.matchAll(activityRegex)];
            if (resourceMatches.length > 0) {
                resourceMatches.forEach(match => {
                    const title = match[1].trim();
                    const description = match[2].trim();
                    
                    // Extract link if present
                    const linkMatch = description.match(/\[([^\]]+)\]\(([^)]+)\)/);
                    const link = linkMatch ? linkMatch[2] : '';
                    const linkText = linkMatch ? linkMatch[1] : '';
                    
                    result.resources += `
                        <div class="resource-item">
                            <h4>${title}</h4>
                            <p>${markdownToHtml(description)}</p>
                            ${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">Access Resource: ${linkText}</a>` : ''}
                        </div>
                    `;
                });
            } else {
                result.resources = markdownToHtml(content);
            }

            // Parse key takeaways
            const takeawayLines = content.split('\n').filter(line => 
                line.match(/^[-*]\s+/) && line.length > 5
            );
            
            if (takeawayLines.length > 0) {
                result.takeaways = '<ul class="takeaway-list">';
                takeawayLines.forEach(line => {
                    const text = line.replace(/^[-*]\s+/, '').trim();
                    if (text) {
                        result.takeaways += `<li>${markdownToHtml(text)}</li>`;
                    }
                });
                result.takeaways += '</ul>';
            } else {
                result.takeaways = markdownToHtml(content);
            }

            return result;
        }

        // Parse markdown tables into HTML tables
        function parseMarkdownTables(text) {
            // Split text into lines and find table blocks
            const lines = text.split('\n');
            let result = [];
            let i = 0;
            
            while (i < lines.length) {
                const line = lines[i];
                
                // Check if this line starts a table (contains | and is followed by separator)
                if (line.includes('|') && i + 1 < lines.length) {
                    const nextLine = lines[i + 1];
                    // Check if next line is a separator (contains |---)
                    if (nextLine.match(/\|[\s:-]+\|/) || nextLine.match(/^[\s|:-]+$/) && nextLine.includes('-')) {
                        // Found a table! Collect all table rows
                        const tableLines = [line];
                        let j = i + 1;
                        
                        // Collect separator and data rows
                        while (j < lines.length && lines[j].includes('|')) {
                            tableLines.push(lines[j]);
                            j++;
                        }
                        
                        // Convert to HTML table
                        const tableHtml = convertTableToHtml(tableLines);
                        if (tableHtml) {
                            result.push(tableHtml);
                            i = j;
                            continue;
                        }
                    }
                }
                
                result.push(line);
                i++;
            }
            
            return result.join('\n');
        }

        // Convert table lines to HTML
        function convertTableToHtml(tableLines) {
            if (tableLines.length < 3) return null; // Need header, separator, at least 1 data row
            
            let html = '<table>';
            
            // Parse header row (first line)
            const headerCells = parseTableRow(tableLines[0]);
            if (headerCells.length === 0) return null;
            
            html += '<thead><tr>';
            headerCells.forEach(cell => {
                html += `<th>${cell.trim()}</th>`;
            });
            html += '</tr></thead>';
            
            // Parse data rows (skip separator at index 1)
            html += '<tbody>';
            for (let i = 2; i < tableLines.length; i++) {
                const cells = parseTableRow(tableLines[i]);
                if (cells.length > 0) {
                    html += '<tr>';
                    cells.forEach(cell => {
                        html += `<td>${cell.trim()}</td>`;
                    });
                    html += '</tr>';
                }
            }
            html += '</tbody></table>';
            
            return html;
        }

        // Parse a single table row into cells
        function parseTableRow(row) {
            const trimmed = row.trim();
            if (!trimmed.includes('|')) return [];
            
            // Remove outer pipes and split
            let inner = trimmed;
            if (inner.startsWith('|')) inner = inner.substring(1);
            if (inner.endsWith('|')) inner = inner.substring(0, inner.length - 1);
            
            return inner.split('|').filter(cell => !cell.match(/^[\s:-]+$/));
        }

        // Parse and render diagrams
        function parseDiagrams(text) {
            // Look for diagram placeholders: [DIAGRAM:name]
            return text.replace(/\[DIAGRAM:(\w+)\]/g, (match, diagramName) => {
                return getDiagram(diagramName);
            });
        }

        // Get SVG diagram by name
        function getDiagram(name) {
            const diagrams = {
                'ai-ml-dl': `
                    <div class="concept-diagram">

        // Convert markdown to HTML
        function markdownToHtml(markdown) {

                return `<div class="code-block-container"><div class="code-block-header"><div class="code-block-header-left"><div class="code-window-dots"><span class="code-window-dot red"></span><span class="code-window-dot yellow"></span><span class="code-window-dot green"></span></div><span class="code-language-badge">${language}</span></div><div class="code-block-actions"><button class="code-copy-btn" onclick="copyCode('${codeId}')"><span>📋</span> Copy</button></div></div><div class="code-block-body"><pre><code id="${codeId}">${highlightedCode}</code></pre></div><div class="code-run-hint"><span>💡</span><span>Run this code in <a href="https://colab.research.google.com/" target="_blank">Google Colab</a> or <a href="https://jupyter.org/try" target="_blank">Jupyter Notebook</a></span></div></div>`;
            });

            // Parse markdown tables before other processing
            html = parseMarkdownTables(html);

            // Horizontal rules (--- or *** or ___) - convert to <hr> or remove
            html = html.replace(/^[\s]*[-*_]{3,}[\s]*$/gm, '<hr>');

            // Parse response/discussion areas - "Write your response:" followed by underscores
            html = html.replace(/Write your response:\s*[_]+/g, (match) => {
                const responseId = 'response_' + Math.random().toString(36).substr(2, 9);
                return `<div class="response-container"><div class="response-label">Write your response:</div><textarea class="response-textarea" id="${responseId}" placeholder="Type your thoughtful response here... Consider the key points from the discussion prompt above." oninput="updateCharCount('${responseId}')"></textarea><div class="response-char-count" id="${responseId}_count">0 characters</div><div class="response-actions"><button class="response-save-btn" onclick="saveResponse('${responseId}')">💾 Save Response</button></div></div>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

            // Headers
            html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Blockquotes
            html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

            // Unordered lists
            html = html.replace(/(?:^|\n)((?:[-*+] .+(?:\n|$))+)/g, (match, list) => {
                const items = list.trim().split('\n').map(item => {
                    const text = item.replace(/^[-*+] /, '');
                    return `<li>${text}</li>`;
                }).join('');
                return `<ul>${items}</ul>`;
            });

            // Ordered lists
            html = html.replace(/(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g, (match, list) => {
                const items = list.trim().split('\n').map(item => {
                    const text = item.replace(/^\d+\. /, '');
                    return `<li>${text}</li>`;
                }).join('');
                return `<ol>${items}</ol>`;
            });

            // Paragraphs (lines separated by blank lines)
            html = html.split(/\n\s*\n/).map(para => {
                para = para.trim();
                if (!para) return '';
                // Don't wrap if already wrapped in a block element
                if (para.match(/^<(?:h[1-6]|ul|ol|pre|blockquote|div)/)) {
                    return para;
                }
                return `<p>${para}</p>`;
            }).join('\n');

            // Line breaks
            html = html.replace(/\n/g, '<br>');
            // Clean up excessive line breaks
            html = html.replace(/(<br>\s*)+<\/(p|li|h[1-6]|blockquote)>/g, '</$1>');
            html = html.replace(/<(p|li|h[1-6]|blockquote)>(<br>\s*)+/g, '<$1>');

            return html;
        }

        // Escape HTML special characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Syntax highlighting for code blocks
        function highlightSyntax(code, language) {
            if (language === 'python') {
                // Python keywords
                const keywords = ['def', 'class', 'if', 'elif', 'else', 'for', 'while', 'try', 'except', 'finally', 
                                  'with', 'as', 'import', 'from', 'return', 'yield', 'raise', 'pass', 'break', 
                                  'continue', 'in', 'is', 'not', 'and', 'or', 'lambda', 'True', 'False', 'None',
                                  'async', 'await', 'global', 'nonlocal', 'assert', 'del'];
                const builtins = ['print', 'len', 'range', 'str', 'int', 'float', 'list', 'dict', 'set', 'tuple',
                                  'open', 'input', 'type', 'isinstance', 'hasattr', 'getattr', 'setattr', 'sum',
                                  'min', 'max', 'abs', 'round', 'sorted', 'enumerate', 'zip', 'map', 'filter',
                                  'any', 'all', 'ord', 'chr', 'hex', 'bin', 'oct', 'format', 'super', 'self'];
                
                // Process line by line to handle comments correctly
                return code.split('\n').map(line => {
                    // Handle comments first (preserve them)
                    let commentIndex = line.indexOf('#');
                    let codePart = commentIndex >= 0 ? line.substring(0, commentIndex) : line;
                    let commentPart = commentIndex >= 0 ? line.substring(commentIndex) : '';
                    
                    // Highlight strings (handle escaped quotes)
                    codePart = codePart.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, 
                        '<span class="string">$1</span>');
                    
                    // Highlight numbers
                    codePart = codePart.replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>');
                    
                    // Highlight keywords
                    keywords.forEach(kw => {
                        const regex = new RegExp('\\b(' + kw + ')\\b', 'g');
                        codePart = codePart.replace(regex, '<span class="keyword">$1</span>');
                    });
                    
                    // Highlight built-in functions
                    builtins.forEach(fn => {
                        const regex = new RegExp('\\b(' + fn + ')\\s*\\(', 'g');
                        codePart = codePart.replace(regex, '<span class="builtin">$1</span>(');
                    });
                    
                    // Highlight function definitions
                    codePart = codePart.replace(/\b(def)\s+(\w+)/g, '<span class="keyword">$1</span> <span class="function">$2</span>');
                    
                    // Highlight class definitions
                    codePart = codePart.replace(/\b(class)\s+(\w+)/g, '<span class="keyword">$1</span> <span class="class-name">$2</span>');
                    
                    // Highlight comment
                    if (commentPart) {
                        commentPart = '<span class="comment">' + commentPart + '</span>';
                    }
                    
                    return codePart + commentPart;
                }).join('\n');
            }
            
            // For other languages, just return the code with basic highlighting
            return code
                .replace(/(["'])((?:\\.|[^\\])*?)\1/g, '<span class="string">$1$2$1</span>')
                .replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>')
                .replace(/\/\/(.*?)$/gm, '<span class="comment">//$1</span>')
                .replace(/\/\*([\s\S]*?)\*\//g, '<span class="comment">/*$1*/</span>');
        }

        // Copy code to clipboard
        function copyCode(codeId) {
            const codeElement = document.getElementById(codeId);
            if (!codeElement) return;
            
            // Get text content without HTML tags
            const text = codeElement.textContent || codeElement.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                // Find the copy button and update it
                const container = codeElement.closest('.code-block-container');
                const copyBtn = container.querySelector('.code-copy-btn');
                if (copyBtn) {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<span>✓</span> Copied!';
                    copyBtn.classList.add('copied');
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }
            }).catch(err => {
                console.error('Failed to copy code:', err);
            });
        }

        // Parse and render interactive quizzes
        function parseQuizzes(content) {

            const quizRegex = /\[QUIZ\]([\s\S]*?)\[\/QUIZ\]/g;

                            </div>
                        </div>
                `;
                
                questions.forEach((q, qIndex) => {

                    const shuffledOptions = shuffleArray([...q.options]);
                    
                    html += `

                            <div class="quiz-options">
                    `;
                    
                    shuffledOptions.forEach((opt, oIndex) => {
                        const optionLetter = String.fromCharCode(65 + oIndex);
                        html += `
                            <div class="quiz-option" data-value="${opt.letter}">
                                <span class="radio-custom"></span>
                                <span class="quiz-option-text"><strong>${optionLetter})</strong> ${opt.text}</span>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                            <div class="quiz-feedback" id="${questionId}_feedback"></div>
                        </div>
                    `;
                });
                
                html += `<div class="quiz-actions"><button class="quiz-check-btn" onclick="checkQuizAnswers('${quizId}', ${questions.length})">Check All Answers</button><button class="quiz-reset-btn" onclick="resetQuiz('${quizId}', ${questions.length})">Reset Quiz</button></div><div class="quiz-score" id="${quizId}_score"><div class="quiz-score-content"><div class="quiz-score-circle"><svg width="80" height="80" viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="36"/><circle class="progress" id="${quizId}_progress" cx="40" cy="40" r="36" stroke-dasharray="226.2" stroke-dashoffset="226.2"/></svg><div class="quiz-score-text" id="${quizId}_score_num">0/${questions.length}</div></div><div class="quiz-score-details"><div class="quiz-score-label">Your Score</div><div class="quiz-score-message" id="${quizId}_message">Complete the quiz to see your results</div></div></div></div></div>`;
                
                return html;
            });
        }

        // Parse quiz questions from text
        function parseQuizQuestions(content) {
            const questions = [];
            // Match questions like: **Question 1:** or Q1: or 1.
            const questionBlocks = content.split(/(?=\*\*Question \d+|\*\*Q\d+|^\d+\.\s+\*\*)/m);
            
            questionBlocks.forEach(block => {
                if (!block.trim()) return;
                
                // Extract question text
                const questionMatch = block.match(/(?:\*\*(?:Question \d+|Q\d+)[:\*]*\s*\*?\*?|^\d+\.\s*\*?\*?)(.+?)(?=\n\s*-\s*[A-D]\)|\n\s*[A-D]\)|\n\s*\([A-D]\))/s);
                if (!questionMatch) return;
                
                const questionText = questionMatch[1].replace(/\*\*/g, '').trim();
                
                // Extract options - look for A) B) C) D) patterns
                const optionMatches = [...block.matchAll(/(?:^|\n)\s*[-]?\s*([A-D])\)\s*(.+?)(?=(?:\n\s*[-]?\s*[A-D]\)|\n\s*\*\*Answer|\n\s*$|$))/gs)];
                
                if (optionMatches.length < 2) return;
                
                const options = optionMatches.map(m => ({
                    letter: m[1],
                    text: m[2].trim().replace(/\*\*/g, '')
                }));
                
                // Find correct answer
                const answerMatch = block.match(/\*\*Answer[:\s]*\*?\*?\s*([A-D])/i);
                const correct = answerMatch ? answerMatch[1].toUpperCase() : 'A';
                
                questions.push({
                    question: questionText,
                    options: options,
                    correct: correct
                });
            });
            
            return questions;
        }

        // Shuffle array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Select quiz option - ensures single selection like Google Forms
        function selectQuizOption(element, questionId, quizId, totalQuestions) {
            // Get the question container and clear ALL selections in this question
            const questionContainer = document.getElementById(questionId);
            const options = questionContainer.querySelectorAll('.quiz-option');
            
            // Clear all selections and previous answer states
            options.forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            
            // Clear feedback when re-selecting
            const feedback = document.getElementById(questionId + '_feedback');
            if (feedback) {
                feedback.className = 'quiz-feedback';
                feedback.textContent = '';
            }
            
            // Select only the clicked option
            element.classList.add('selected');
            
            // Mark question as answered
            questionContainer.classList.add('answered');
            
            // Update answered count
            if (quizId) {
                const container = document.getElementById(quizId);
                const answeredCount = container.querySelectorAll('.quiz-question.answered').length;
                const answeredSpan = document.getElementById(quizId + '_answered');
                if (answeredSpan) {
                    answeredSpan.textContent = answeredCount;
                }
            }
        }

        // Reset quiz to initial state
        function resetQuiz(quizId, totalQuestions) {
            const container = document.getElementById(quizId);
            
            // Reset all options
            container.querySelectorAll('.quiz-option').forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            
            // Reset questions
            container.querySelectorAll('.quiz-question').forEach(q => {
                q.classList.remove('answered');
            });
            
            // Reset feedback
            container.querySelectorAll('.quiz-feedback').forEach(fb => {
                fb.className = 'quiz-feedback';
                fb.textContent = '';
            });
            
            // Reset answered count
            const answeredSpan = document.getElementById(quizId + '_answered');
            if (answeredSpan) answeredSpan.textContent = '0';
            
            // Hide score
            const scoreDiv = document.getElementById(quizId + '_score');
            if (scoreDiv) scoreDiv.classList.remove('show');
        }

        // Check quiz answers
        function checkQuizAnswers(quizId, totalQuestions) {
            const container = document.getElementById(quizId);
            const questions = container.querySelectorAll('.quiz-question');
            
            // First check if all questions are answered
            const answeredQuestions = container.querySelectorAll('.quiz-question.answered').length;
            if (answeredQuestions < totalQuestions) {
                // Show alert or highlight unanswered questions
                questions.forEach(q => {
                    if (!q.classList.contains('answered')) {
                        q.style.animation = 'shake 0.5s ease';
                        q.style.boxShadow = '0 0 0 2px rgba(239, 68, 68, 0.5)';
                        setTimeout(() => {
                            q.style.animation = '';
                            q.style.boxShadow = '';
                        }, 1500);
                    }
                });
                
                // Scroll to first unanswered question
                const firstUnanswered = container.querySelector('.quiz-question:not(.answered)');
                if (firstUnanswered) {
                    firstUnanswered.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return; // Don't proceed with checking
            }
            
            let correct = 0;
            
            questions.forEach((q, idx) => {
                const correctAnswer = q.dataset.correct;
                const selectedOption = q.querySelector('.quiz-option.selected');
                const feedbackId = q.id + '_feedback';
                const feedback = document.getElementById(feedbackId);
                const allOptions = q.querySelectorAll('.quiz-option');
                
                // Reset states
                allOptions.forEach(opt => {
                    opt.classList.remove('correct', 'incorrect');
                });
                
                if (selectedOption) {
                    const selectedValue = selectedOption.dataset.value;
                    
                    if (selectedValue === correctAnswer) {
                        correct++;
                        selectedOption.classList.add('correct');
                        if (feedback) {
                            feedback.className = 'quiz-feedback correct';
                            feedback.textContent = '✓ Correct!';
                        }
                    } else {
                        selectedOption.classList.add('incorrect');
                        // Highlight correct answer
                        allOptions.forEach(opt => {
                            if (opt.dataset.value === correctAnswer) {
                                opt.classList.add('correct');
                            }
                        });
                        if (feedback) {
                            feedback.className = 'quiz-feedback incorrect';
                            feedback.textContent = `✗ The correct answer is ${correctAnswer}.`;
                        }
                    }
                }
            });
            
            // Show score with animation
            const scoreDiv = document.getElementById(quizId + '_score');
            const scoreNum = document.getElementById(quizId + '_score_num');
            const progressCircle = document.getElementById(quizId + '_progress');
            const messageDiv = document.getElementById(quizId + '_message');
            
            scoreDiv.classList.add('show');
            scoreNum.textContent = `${correct}/${totalQuestions}`;
            
            // Animate progress circle
            const percentage = correct / totalQuestions;
            const circumference = 226.2; // 2 * PI * 36
            const offset = circumference * (1 - percentage);
            progressCircle.style.strokeDashoffset = offset;
            
            // Set message based on score
            const percent = (correct / totalQuestions) * 100;
            if (percent >= 80) {
                messageDiv.textContent = 'Excellent! You have mastered this content.';
                messageDiv.className = 'quiz-score-message excellent';
            } else if (percent >= 60) {
                messageDiv.textContent = 'Good job! Review the missed questions.';
                messageDiv.className = 'quiz-score-message good';
            } else {
                messageDiv.textContent = 'Keep practicing. Review the content and try again.';
                messageDiv.className = 'quiz-score-message needs-work';
            }
            
            // Scroll to score
            scoreDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Event delegation for quiz options (more reliable than inline onclick)
        document.addEventListener('click', function(e) {
            const quizOption = e.target.closest('.quiz-option');
            if (quizOption) {
                const questionContainer = quizOption.closest('.quiz-question');
                const quizContainer = quizOption.closest('.quiz-container');
                
                if (questionContainer && quizContainer) {
                    const questionId = questionContainer.id;
                    const quizId = quizContainer.id;
                    const totalQuestions = quizContainer.querySelectorAll('.quiz-question').length;
                    
                    selectQuizOption(quizOption, questionId, quizId, totalQuestions);
                }
            }
        });

        // Update character count for response textarea
        function updateCharCount(responseId) {
            const textarea = document.getElementById(responseId);
            const countEl = document.getElementById(responseId + '_count');
            if (textarea && countEl) {
                const count = textarea.value.length;
                countEl.textContent = `${count} character${count !== 1 ? 's' : ''}`;
            }
        }

        // Save response to localStorage
        function saveResponse(responseId) {
            const textarea = document.getElementById(responseId);
            const btn = event.target.closest('.response-save-btn');
            
            if (textarea && textarea.value.trim()) {
                // Get the current session key for storage
                const sessionKey = currentSessionIndex >= 0 ? `session_${currentSessionIndex}` : 'overview';
                const storageKey = `response_${sessionKey}_${responseId}`;
                
                // Save to localStorage
                localStorage.setItem(storageKey, textarea.value);
                
                // Visual feedback
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '✓ Saved!';
                btn.classList.add('saved');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('saved');
                }, 2000);
            }
        }

        // Load saved responses when content loads
        function loadSavedResponses() {
            const sessionKey = currentSessionIndex >= 0 ? `session_${currentSessionIndex}` : 'overview';
            
            document.querySelectorAll('.response-textarea').forEach(textarea => {
                const storageKey = `response_${sessionKey}_${textarea.id}`;
                const saved = localStorage.getItem(storageKey);
                if (saved) {
                    textarea.value = saved;
                    updateCharCount(textarea.id);
                }
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
